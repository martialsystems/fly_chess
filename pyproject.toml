[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-chess"
version = "0.1.0"
description = "MaleCNS-style fixture: ethological chess dictionary and piece-plane readout"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martial Systems LLC" }]
dependencies = [
  "numpy>=1.26",
  "python-chess>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
malecns = ["pandas>=2.0", "pyarrow>=14"]

[project.scripts]
fly-chess = "fly_chess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
